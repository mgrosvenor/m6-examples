global_params = ["data/site.json"]
secrets_file  = "/etc/m6/render-contact.toml"

[[route]]
path     = "/contact"
template = "templates/contact.html"
params   = []
cache    = "no-store"

# DEVELOPMENT VALUES. In production these move to secrets_file and are DELETED
# from here.
#
# They are not "overridden" -- a key set in both this file and the secrets file is
# refused at startup, naming the key. m6-core used to merge with "secrets win",
# silently, and that let a config state a value that was not in use: a deployed
# render-contact.conf read `from = "noreply@..."` and `host = "localhost"` while
# the running service relayed through a real provider as a different domain
# entirely. Reading the config told you something false about a live system.
#
# So each key has exactly one owner. Locally, that owner is this file and
# /etc/m6/render-contact.toml does not exist, which is why the example runs with
# no setup. In production, create the secrets file with the real values and
# remove the whole [smtp] section below.
#
# Do not be tempted to leave a broken placeholder here so a missing secrets file
# fails loudly -- that is what made the config misleading. An ABSENT required key
# fails loudly by itself, and says which key is missing.
[smtp]
host     = "localhost"
port     = 1025
username = ""
password = ""
from     = "noreply@example.com"
to       = "owner@example.com"

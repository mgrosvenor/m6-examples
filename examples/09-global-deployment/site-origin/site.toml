# Origin site config — local dev
# Used by both the H2C instance (port 9000) and the public TLS instance (port 9001).
# Backends are the same socket paths that 07-dev-to-production/dev.sh creates.

[site]
name   = "My Blog"
domain = "localhost"

[auth]
backend    = "m6-auth"
public_key = "../keys/auth.pub"

[errors]
mode = "internal"

[log]
level  = "info"
format = "text"

# ── Backends — Unix sockets (started by dev.sh) ───────────────────────────────

[[backend]]
name    = "m6-html"
sockets = "/tmp/m6/m6-html*.sock"

[[backend]]
name    = "m6-file"
sockets = "/tmp/m6/m6-file*.sock"

[[backend]]
name    = "m6-auth"
sockets = "/tmp/m6/m6-auth*.sock"

[[backend]]
name    = "render-cms"
sockets = "/tmp/m6/render-cms*.sock"

# ── Public routes — no auth ────────────────────────────────────────────────────

[[route]]
path    = "/"
backend = "m6-html"

[[route]]
path    = "/about"
backend = "m6-html"

[[route]]
path    = "/blog"
backend = "m6-html"

[[route]]
path    = "/blog/{stem}"
backend = "m6-html"

[[route]]
path    = "/assets/{*relpath}"
backend = "m6-file"

[[route]]
path    = "/_errors"
backend = "m6-html"

# ── Contact ────────────────────────────────────────────────────────────────────

[[route]]
path    = "/contact"
backend = "render-cms"

# ── Auth ───────────────────────────────────────────────────────────────────────

[[route]]
path    = "/login"
backend = "m6-html"

[[route]]
path    = "/auth/login"
backend = "m6-auth"

[[route]]
path    = "/auth/logout"
backend = "m6-auth"

[[route]]
path    = "/auth/refresh"
backend = "m6-auth"

# ── CMS — protected ───────────────────────────────────────────────────────────

[[route]]
path    = "/cms"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/cms/edit/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/cms/new"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/drafts"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/drafts/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/publish/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/unpublish/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/posts/{stem}"
backend = "render-cms"
require = "group:editors"

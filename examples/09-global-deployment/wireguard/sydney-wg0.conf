# Sydney — WireGuard hub
# Replace SYDNEY_PRIVATE_KEY and all PUBLIC_KEY placeholders with real keys.
# Generate keys: wg genkey | tee privatekey | wg pubkey > publickey

[Interface]
PrivateKey = <SYDNEY_PRIVATE_KEY>
Address    = 10.0.0.1/24
ListenPort = 51820

# Firewall: allow UDP 51820 inbound on Sydney's public interface.
# PostUp   = ufw allow 51820/udp
# PostDown = ufw delete allow 51820/udp

[Peer]
# San Francisco
PublicKey  = <SF_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32

[Peer]
# New York
PublicKey  = <NYC_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32

[Peer]
# Chicago
PublicKey  = <CHICAGO_PUBLIC_KEY>
AllowedIPs = 10.0.0.4/32

[Peer]
# London
PublicKey  = <LONDON_PUBLIC_KEY>
AllowedIPs = 10.0.0.5/32

[Peer]
# Singapore
PublicKey  = <SINGAPORE_PUBLIC_KEY>
AllowedIPs = 10.0.0.6/32

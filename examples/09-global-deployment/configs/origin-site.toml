[site]
name   = "My Blog"
domain = "example.com"

[auth]
backend    = "m6-auth"
public_key = "/etc/m6/auth.pub"

[errors]
mode = "internal"

[log]
level  = "info"
format = "text"

# ── Backends — Unix sockets shared with the H2C instance ──────────────────────

[[backend]]
name    = "m6-html"
sockets = "/run/m6/m6-html*.sock"

[[backend]]
name    = "m6-file"
sockets = "/run/m6/m6-file*.sock"

[[backend]]
name    = "m6-auth"
sockets = "/run/m6/m6-auth*.sock"

[[backend]]
name    = "render-cms"
sockets = "/run/m6/render-cms*.sock"

# ── Public routes — no auth ────────────────────────────────────────────────────

[[route]]
path    = "/"
backend = "m6-html"

[[route]]
path    = "/about"
backend = "m6-html"

[[route]]
path    = "/blog"
backend = "m6-html"

[[route]]
path    = "/blog/{stem}"
backend = "m6-html"

[[route]]
path    = "/assets/{*relpath}"
backend = "m6-file"

[[route]]
path    = "/_errors"
backend = "m6-html"

# ── Contact — public ──────────────────────────────────────────────────────────

[[route]]
path    = "/contact"
backend = "render-cms"

# ── Auth endpoints — public ───────────────────────────────────────────────────

[[route]]
path    = "/login"
backend = "m6-html"

[[route]]
path    = "/auth/login"
backend = "m6-auth"

[[route]]
path    = "/auth/logout"
backend = "m6-auth"

[[route]]
path    = "/auth/refresh"
backend = "m6-auth"

# ── CMS — all protected, never cached ─────────────────────────────────────────

[[route]]
path    = "/cms"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/cms/edit/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/cms/new"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/drafts"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/drafts/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/publish/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/unpublish/{stem}"
backend = "render-cms"
require = "group:editors"

[[route]]
path    = "/api/posts/{stem}"
backend = "render-cms"
require = "group:editors"

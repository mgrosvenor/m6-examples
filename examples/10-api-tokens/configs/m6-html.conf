global_params = ["data/site.json"]

[[route]]
path     = "/"
template = "templates/home.html"
params   = []

[[route]]
path     = "/login"
template = "templates/login.html"
params   = []
cache    = "no-store"

[[route]]
path     = "/dashboard"
template = "templates/dashboard.html"
params   = []
cache    = "no-store"

[[route]]
path     = "/api/data"
template = "templates/api-data.html"
params   = ["data/api-data.json"]
cache    = "no-store"

[[route]]
path     = "/_errors"
template = "templates/error.html"
params   = []
cache    = "no-store"

{% extends "templates/base.html" %}
{% block title %}{{ query.status }} · {{ site_name }}{% endblock %}
{% block content %}
  <h1>{{ query.status }} — {{ query.reason }}</h1>
  {% if query.path is defined %}
    <p>Path: <code>{{ query.path }}</code></p>
  {% endif %}
  <a href="/">Return home</a>
{% endblock %}

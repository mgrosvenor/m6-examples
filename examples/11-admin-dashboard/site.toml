# example 11 — admin dashboard
# All /api/admin/* routes are protected by "role:admin".

[site]
name   = "m6 Admin Dashboard"
domain = "localhost"

[server]
bind     = "127.0.0.1:8444"
tls_cert = "keys/dev.pem"
tls_key  = "keys/dev-key.pem"

[auth]
backend    = "auth"
public_key = "keys/auth.pub"

[errors]
mode             = "internal"
verbose_fallback = true

[log]
level  = "debug"
format = "json"

[[backend]]
name    = "render-admin"
sockets = "/tmp/m6/render-admin.sock"

[[backend]]
name    = "auth"
sockets = "/tmp/m6/m6-auth-admin.sock"

[[backend]]
name    = "static"
sockets = "/tmp/m6/m6-file-admin.sock"

[[route]]
path    = "/"
backend = "static"
cache   = "public, max-age=3600"

# Login redirect target — serves the SPA which has its own login overlay.
[[route]]
path    = "/login"
backend = "static"
cache   = "no-store"

# Admin API routes — all require role:admin
[[route]]
path    = "/api/admin/perf"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/routes"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/system"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/bench"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/bench/{id}"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/logs"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/config"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/config/touch"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/cache/flush"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/services/{name}/restart"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/backends"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/backends/{name}/sample"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

[[route]]
path    = "/api/admin/backends/{name}/alltime"
backend = "render-admin"
require = "role:admin"
cache   = "no-store"

# Auth endpoints
[[route]]
path    = "/auth/login"
backend = "auth"
cache   = "no-store"

[[route]]
path    = "/auth/logout"
backend = "auth"
cache   = "no-store"

[[route]]
path    = "/auth/refresh"
backend = "auth"
cache   = "no-store"

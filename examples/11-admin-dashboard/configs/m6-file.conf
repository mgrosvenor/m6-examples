# m6-file is an `App` service as of 2026-09-12: the handler is registered in code
# under the name `files`, and every route that uses it must say so. A route
# naming a handler the binary does not have is fatal -- the service exits 2
# before binding and a reload is refused, leaving the previous routes serving.
#
# `{*relpath}` is the explicit wildcard. m6-file's own matcher used to make a
# bare trailing `{relpath}` greedy; m6-core does not, because making the last
# `{param}` implicitly span several segments would silently change the meaning of
# every route already written.

# Serve the AJAJ admin dashboard (public/index.html).
[[route]]
path = "/"
handler = "files"
root = "public/index.html"

[[route]]
path = "/login"
handler = "files"
root = "public/index.html"

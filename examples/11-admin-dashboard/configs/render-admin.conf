# render-admin config
# These keys are read by init_global() via the m6-render user_config dict.

socket   = "/tmp/m6/render-admin.sock"

# Path to the m6-http JSON-lines log (used for /api/admin/perf and /api/admin/logs).
log_file = "/tmp/m6/m6-http-admin.log"

# Path to the site's own site.toml (used for config read/write/touch and bench targets).
site_toml = "site.toml"

# How many "periodic stats" history entries to return by default.
perf_history = 60

# How many "request complete" log entries to sample for per-route stats.
routes_sample = 10000

# Default number of log lines to return.
log_tail_default = 100

# Path to the m6-bench binary.
bench_bin = "m6-bench"

# Default bench duration and concurrency.
bench_duration_secs = 10
bench_concurrency   = 50

# Services that can be restarted via POST /api/admin/services/{name}/restart.
# Each entry needs a name and a PID file path.
[[services]]
name     = "m6-http"
pid_file = "/tmp/m6/m6-http-admin.pid"

[[services]]
name     = "render-admin"
pid_file = "/tmp/m6/render-admin.pid"

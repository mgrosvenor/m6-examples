[site]
name   = "Log Viewer Demo"
domain = "localhost"

[log]
level  = "debug"
format = "json"

[errors]
mode = "internal"

[[backend]]
name    = "m6-html"
sockets = "/tmp/m6/m6-html*.sock"

[[backend]]
name    = "m6-file"
sockets = "/tmp/m6/m6-file*.sock"

# ── Static pages and log viewer UI (served by m6-html) ─────────

[[route]]
path    = "/"
backend = "m6-html"

[[route]]
path    = "/logs"
backend = "m6-html"

[[route]]
path    = "/bench"
backend = "m6-html"

[[route_group]]
glob    = "assets/**/*"
path    = "/assets/{relpath}"
backend = "m6-file"

# ── Log file tailing — no-store, served by m6-file tail mode ───
# Browser JS polls GET /logs/tail/<name>.log?offset=N
# m6-file returns bytes from that offset with X-Log-End header.
#
# Direct route (not route_group) so m6-http forwards all /logs/tail/*
# requests to m6-file without requiring the log files to exist at startup.
# m6-http.log is created by the shell redirect when m6-http launches, which
# is after m6-http has already scanned the route_group glob — so it would
# never appear in the table, causing a NetworkError in the browser.

[[route]]
path    = "/logs/tail/{relpath}"
backend = "m6-file"

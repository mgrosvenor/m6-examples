# Serve static assets normally (cached).
# CORP header required so COEP on the /bench page doesn't block these assets.
[[route]]
path    = "/assets/{relpath}"
root    = "assets/"
headers = [["Cross-Origin-Resource-Policy", "same-origin"]]

# Tail mode: serve log files from a byte offset, no caching.
# The browser JS polls GET /logs/tail/<name>.log?offset=N
# and reads the X-Log-End response header for the next offset.
[[route]]
path = "/logs/tail/{relpath}"
root = "logs/"
tail = true

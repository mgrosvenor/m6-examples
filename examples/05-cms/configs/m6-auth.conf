[storage]
path = "data/auth.db"

[tokens]
access_ttl  = 900
refresh_ttl = 2592000
issuer      = "localhost"

[keys]
private_key = "keys/auth.pem"
public_key  = "keys/auth.pub"

# Login throttle. Defaults are 5 failed attempts per 900 seconds per IP; only
# failures count, and a correct password clears the count.
#
# `window_secs` is 5 here, not 900, because this is a development config and
# `test.sh` proves the throttle works by getting the password wrong five times
# on purpose. With the production window that would leave this IP blocked for
# fifteen minutes, so the next run of the suite would start locked out and every
# authenticated check in it would fail while pointing at authentication rather
# than at the throttle. A short window lets the test assert the recovery as
# well, which is the half that would otherwise go unchecked.
#
# Production keeps the default: leave this section out.
[rate_limit]
max_attempts = 5
window_secs  = 5

name: CI

# Every push and every pull request.
#
# ── Why this exists ──────────────────────────────────────────────────────────
#
# It did not, until 2026-09-14, and by then this repository had not compiled for
# days: every renderer crate still pointed at `m6-render`, a crate m6 had
# deleted. The stale binaries left in target/release from before the deletion
# meant running an example still appeared to work, so nothing announced it.
#
# Underneath that were five more defects, each invisible for the same reason.
# Every asset in every example returned 502, because m6-file became an `App`
# service and ten configs here were left naming no handler, so it exited 2
# before binding. PATCH was refused at the edge. Unpublishing a CMS post
# answered `{"unpublished": true}` and left the post listed and readable.
# Starting an example ran `pkill -x m6-http` and killed every other m6 on the
# machine.
#
# None of them were subtle. They survived because nothing built this repository.
#
# ── The two directions, and who checks which ─────────────────────────────────
#
# m6's own CI checks out THIS repository and builds it against the m6 commit
# under test, which catches an m6 change breaking the code that uses m6.
#
# This workflow is the other direction: it builds these examples against m6, so
# a change made HERE is checked. It tracks m6's `develop` by default, because
# that is where m6's work lands and drift is cheapest to fix early. Use the
# manual trigger with a different ref to check against a release tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      m6_ref:
        description: 'm6 ref to build against (branch, tag or SHA)'
        required: false
        default: develop

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build, clippy, tests, configs, end to end
    runs-on: ubuntu-latest
    steps:
      # SIBLING CHECKOUTS, and the layout is load-bearing. The renderer crates
      # depend on m6 by relative path (`../../../../m6/m6-core`), so this
      # repository and m6 have to sit beside each other. Checking either one out
      # at the workspace root breaks the path, and the error is a missing
      # Cargo.toml several directories away from the cause.
      - uses: actions/checkout@v4
        with:
          path: m6-examples

      - uses: actions/checkout@v4
        with:
          repository: mgrosvenor/m6
          ref: ${{ github.event.inputs.m6_ref || 'develop' }}
          path: m6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            m6
            m6-examples

      - name: Which m6 is being built against
        working-directory: m6
        run: |
          echo "ref:    ${{ github.event.inputs.m6_ref || 'develop' }}"
          echo "commit: $(git rev-parse HEAD)"
          echo "subject: $(git log -1 --pretty=%s)"

      - name: Build m6
        working-directory: m6
        run: |
          cargo build --workspace --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # Zero warnings and silent clippy, the same standard m6 holds itself to.
      # A reader copies from these files.
      - name: Build the examples, zero warnings
        working-directory: m6-examples
        run: |
          cargo build --release 2>&1 | tee build.log
          n=$(grep -c '^warning' build.log || true)
          echo "release warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n warning(s)"; exit 1; }

      - name: Clippy, silent
        working-directory: m6-examples
        run: |
          cargo clippy --workspace --all-targets --release 2>&1 | tee clippy.log
          n=$(grep -c '^warning' clippy.log || true)
          [ "$n" -eq 0 ] || { echo "::error::$n clippy finding(s)"; exit 1; }

      # Captured in full, then reported. Grepping the pipe drops the assertion
      # message and leaves a bare `panicked at <file>:<line>`, which names the
      # place and not the reason.
      - name: Unit tests
        working-directory: m6-examples
        run: |
          cargo test --workspace > full.log 2>&1 || true
          grep -E '^test result:' full.log || true
          if grep -q '^failures:' full.log; then
            sed -n '/^failures:/,$p' full.log | head -60
            echo "::error::tests failed"
            exit 1
          fi

      # Parsed with the real binary, because a config this repository cannot
      # start is the defect that hid for two days. Every example is accounted
      # for: 06-systemd is systemd units with no site config, and
      # 09-global-deployment's configs name /etc/letsencrypt paths for five real
      # cache nodes, so m6-http rejects them here for a missing certificate
      # rather than for anything wrong with them (its own integration test covers
      # it, and ran above). An example with neither a config nor a reason
      # recorded here fails the job, rather than being quietly stepped over.
      - name: Every example's config parses
        working-directory: m6-examples
        run: |
          bad=0 unexplained=0
          for d in examples/*/; do
            name=$(basename "$d")
            case "$name" in
              data) continue ;;
              06-systemd) echo "  $name  not parsed: systemd units only, no site config"; continue ;;
              09-global-deployment) echo "  $name  not parsed: configs name letsencrypt paths; its integration test covers it"; continue ;;
            esac
            sys="$d/configs/system-dev.toml"
            [ -f "$sys" ] || sys="$d/site.toml"
            if [ ! -f "$sys" ]; then
              echo "  $name  NO CONFIG and no reason recorded for that"
              unexplained=$((unexplained + 1)); continue
            fi
            if out=$(m6-http "$(cd "$d" && pwd)" "$(cd "$(dirname "$sys")" && pwd)/$(basename "$sys")" --dump-config 2>&1 >/dev/null) && [ -z "$out" ]; then
              echo "  $name  ok"
            else
              echo "  $name  $(echo "$out" | head -1)"
              bad=$((bad + 1))
            fi
          done
          [ "$bad" -eq 0 ] || { echo "::error::$bad config(s) rejected by m6-http"; exit 1; }
          [ "$unexplained" -eq 0 ] || { echo "::error::$unexplained example(s) with no config and no recorded reason"; exit 1; }

      # Example 05 runs the whole stack: m6-http at the edge, m6-html, m6-file,
      # m6-md, m6-auth-server and a custom renderer. If this passes, the parts
      # work together.
      #
      # A FRESH CHECKOUT, which is the point. keys/ and the auth database are not
      # in git, so dev.sh generates a certificate with openssl (the runner has no
      # mkcert) and creates the admin user. That is exactly what a reader gets on
      # step one of the README, checked rather than assumed.
      - name: Example 05, end to end over the running stack
        working-directory: m6-examples/examples/05-cms
        run: |
          M6="$GITHUB_WORKSPACE/m6" M6_NO_BROWSER=1 ./dev.sh --no-open > dev.log 2>&1 &
          for _ in $(seq 1 180); do
            code=$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null)" != "200" ]; then
            echo "--- dev.sh ---"; tail -40 dev.log
            echo "--- services ---"; tail -20 logs/*.log 2>/dev/null || true
            echo "::error::the 05-cms stack never answered in 180s"
            exit 1
          fi
          ./test.sh

      - name: Stop the stack
        if: always()
        working-directory: m6-examples/examples/05-cms
        run: |
          for pid in $(pgrep -f "$PWD" 2>/dev/null || true); do
            [ "$pid" = "$$" ] && continue
            kill "$pid" 2>/dev/null || true
          done

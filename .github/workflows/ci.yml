name: CI

# Runs on pull requests, not pushes: a push to a branch has been checked when its
# pull request was.
#
# The renderer crates depend on m6 by relative path, so this repository builds
# against an m6 checkout. This workflow checks the examples against m6; it tracks
# m6's `develop` by default. Use the manual trigger with another ref to check
# against a release tag.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      m6_ref:
        description: 'm6 ref to build against (branch, tag or SHA)'
        required: false
        default: develop

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build, clippy, tests, configs, end to end
    runs-on: ubuntu-latest
    steps:
      # Sibling checkouts: the renderer crates depend on m6 by relative path
      # (`../../../../m6/m6-core`), so this repository and m6 sit side by side.
      - uses: actions/checkout@v4
        with:
          path: m6-examples

      - uses: actions/checkout@v4
        with:
          repository: mgrosvenor/m6
          ref: ${{ github.event.inputs.m6_ref || 'develop' }}
          path: m6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            m6
            m6-examples

      - name: Which m6 is being built against
        working-directory: m6
        run: |
          echo "ref:    ${{ github.event.inputs.m6_ref || 'develop' }}"
          echo "commit: $(git rev-parse HEAD)"
          echo "subject: $(git log -1 --pretty=%s)"

      - name: Build m6
        working-directory: m6
        run: |
          cargo build --workspace --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # Zero warnings and silent clippy, the same standard m6 holds itself to.
      # A reader copies from these files.
      - name: Build the examples, zero warnings
        working-directory: m6-examples
        run: |
          cargo build --release 2>&1 | tee build.log
          n=$(grep -c '^warning' build.log || true)
          echo "release warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n warning(s)"; exit 1; }

      - name: Clippy, silent
        working-directory: m6-examples
        run: |
          cargo clippy --workspace --all-targets --release 2>&1 | tee clippy.log
          n=$(grep -c '^warning' clippy.log || true)
          [ "$n" -eq 0 ] || { echo "::error::$n clippy finding(s)"; exit 1; }

      # Captured in full, then reported. Grepping the pipe drops the assertion
      # message and leaves a bare `panicked at <file>:<line>`, which names the
      # place and not the reason.
      - name: Unit tests
        working-directory: m6-examples
        run: |
          # Example 05's end-to-end test needs the certificates and auth
          # database that dev.sh creates, so it runs below once the stack is up.
          cargo test --workspace -- --skip blog_site_end_to_end > full.log 2>&1 || true
          grep -E '^test result:' full.log || true
          if grep -q '^failures:' full.log; then
            sed -n '/^failures:/,$p' full.log | head -60
            echo "::error::tests failed"
            exit 1
          fi

      # A guide that shows m6-http must show a command that starts: m6-http takes a
      # site directory and a system config. A renewal hook that touches a system
      # config only works when that file is the one m6-http is started with, so
      # every `touch` path must be one the same file passes to m6-http. Reads
      # the guides and the unit files.
      - name: Guides start m6-http with two arguments, and hooks touch its config
        working-directory: m6-examples
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          files = subprocess.check_output(
              ["git", "ls-files", "*.md", "*.service", ":!*posts.json"], text=True).split()
          bad = []
          for f in files:
              text = open(f, encoding="utf-8").read().replace("\\\n", " ")
              configs = set()
              for m in re.finditer(r"^ExecStart=\S*/m6-http\s+(.*)$", text, re.M):
                  args = m.group(1).split()
                  if len(args) < 2:
                      bad.append(f"{f}: m6-http ExecStart passes {len(args)} argument(s), needs 2: {m.group(0)}")
                  else:
                      configs.add(args[1])
              for m in re.finditer(r"NODE_CONFIG=(\S+)", text):
                  configs.add(m.group(1))
                  configs.add("${NODE_CONFIG}")
              for m in re.finditer(r"^touch (/etc/m6/\S+\.toml)\s*$", text, re.M):
                  if m.group(1) not in configs:
                      bad.append(f"{f}: a hook touches {m.group(1)}, which m6-http is not started with here")
          print("\n".join(bad) if bad else f"{len(files)} files checked")
          sys.exit(1 if bad else 0)
          PY

      # A fresh checkout has no development keys. The config parse below checks that
      # tls_cert exists, so without this step every example is rejected for a
      # missing file. examples/dev-keys.sh writes them to the private per-user
      # directory that dev-home.sh sets up.
      - name: Development certificates and auth keys
        working-directory: m6-examples
        run: |
          examples/dev-keys.sh
          echo "certificates present"

      # Parsed with the real binary. Every example is accounted for: 06-systemd is
      # systemd units with no site config, and 09-global-deployment has one
      # system config per node and one site config per role, so its own
      # integration test covers it. An example with neither a config nor a reason
      # recorded here fails the job.
      - name: Every example's config parses
        working-directory: m6-examples
        run: |
          bad=0 unexplained=0
          for d in examples/*/; do
            name=$(basename "$d")
            case "$name" in
              data|common) continue ;;
              06-systemd) echo "  $name  not parsed: systemd units only, no site config"; continue ;;
              09-global-deployment) echo "  $name  not parsed: per-node configs, no single system-dev.toml; its integration test covers it"; continue ;;
            esac
            sys="$d/configs/system-dev.toml"
            [ -f "$sys" ] || sys="$d/site.toml"
            if [ ! -f "$sys" ]; then
              echo "  $name  NO CONFIG and no reason recorded for that"
              unexplained=$((unexplained + 1)); continue
            fi
            # The checked-in config names the key directory as @M6_DEV_HOME@;
            # m6 reads the copy with the real path filled in.
            sys=$(. examples/dev-home.sh && m6_conf "$sys")
            if out=$(m6-http "$(cd "$d" && pwd)" "$sys" --dump-config 2>&1 >/dev/null) && [ -z "$out" ]; then
              echo "  $name  ok"
            else
              echo "  $name  $(echo "$out" | head -1)"
              bad=$((bad + 1))
            fi
          done
          [ "$bad" -eq 0 ] || { echo "::error::$bad config(s) rejected by m6-http"; exit 1; }
          [ "$unexplained" -eq 0 ] || { echo "::error::$unexplained example(s) with no config and no recorded reason"; exit 1; }

      # Example 05 runs the whole stack: m6-http at the edge, m6-html, m6-file,
      # m6-md, m6-auth-server and a custom renderer. If this passes, the parts
      # work together.
      #
      # A fresh checkout: the keys and the auth database are not in git, so dev.sh
      # generates a certificate with openssl (the runner has no mkcert) and
      # creates the admin user, as a reader gets on step one of the README.
      - name: Example 05, end to end over the running stack
        working-directory: m6-examples/examples/05-cms
        run: |
          M6="$GITHUB_WORKSPACE/m6" M6_NO_BROWSER=1 ./dev.sh --no-open > dev.log 2>&1 &
          for _ in $(seq 1 180); do
            code=$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null)" != "200" ]; then
            echo "--- dev.sh ---"; tail -40 dev.log
            echo "--- services ---"; tail -20 logs/*.log 2>/dev/null || true
            echo "::error::the 05-cms stack never answered in 180s"
            exit 1
          fi
          ./test.sh
          (cd "$GITHUB_WORKSPACE/m6-examples" && cargo test -p render-cms --test integration)

      - name: Stop the stack
        if: always()
        working-directory: m6-examples/examples/05-cms
        run: |
          for pid in $(pgrep -f "$PWD" 2>/dev/null || true); do
            [ "$pid" = "$$" ] && continue
            kill "$pid" 2>/dev/null || true
          done
